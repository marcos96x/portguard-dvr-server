# Exemplo de proxy reverso com HTTPS para o go2rtc e para a API Portguard.
# Ajuste os nomes de domínio e os caminhos dos certificados.
# A porta 8555 (TCP e UDP) do go2rtc deve permanecer aberta no firewall,
# fora do Nginx, para o WebRTC funcionar bem.

# API de gestão (cadastro de DVRs) — proteja também no nível de rede se possível
server {
    listen 443 ssl http2;
    server_name api-cameras.seu-dominio.com;

    ssl_certificate     /etc/letsencrypt/live/api-cameras.seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-cameras.seu-dominio.com/privkey.pem;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
    }
}

# Painel / streams do go2rtc (iframe, HLS, MSE, snapshot)
server {
    listen 443 ssl http2;
    server_name cameras.seu-dominio.com;

    ssl_certificate     /etc/letsencrypt/live/cameras.seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cameras.seu-dominio.com/privkey.pem;

    # WebSocket (MSE /api/ws) e streams longos
    location / {
        proxy_pass http://127.0.0.1:1984;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
